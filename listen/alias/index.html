@font-face{font-family:Diatype;src:local('ABC Diatype'),url('diatype.otf') format('opentype');font-weight:400;font-display:swap}
:root{--color-title:#222;--color-rule:#000}*{box-sizing:border-box}body{margin:0;background:#fff;color:#222;font:14px Diatype,Arial,sans-serif;-webkit-font-smoothing:antialiased}main{width:min(100% - 40px,720px);margin:0 auto;padding:clamp(48px,14vh,140px) 0 40px}h1{font-size:20px;font-weight:400;margin:0 0 40px}h2{font:inherit;margin:0 0 12px}section+section{margin-top:32px}button:focus-visible{outline:1px solid #222;outline-offset:4px}.status{font-size:12px;color:#777;min-height:18px;margin:18px 0 0}.audio-player{flex-wrap:wrap}.audio-player audio{width:100%}.enhanced audio{display:none}html:not(.enhanced) .audio-player-play,html:not(.enhanced) .audio-player-track,html:not(.enhanced) .audio-player-time{display:none}

  .audio-player {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border: 1px solid rgba(0, 0, 0, 0.08);
    width: 100%;
    margin: 0 auto;
    font-family: inherit;
  }

  .audio-player-play {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    border: 1px solid rgba(0, 0, 0, 0.15);
    border-radius: 50%;
    background: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(0, 0, 0, 0.75);
    transition: border-color 0.15s ease, color 0.15s ease;
    padding: 0;
  }
  .audio-player-play:hover {
    border-color: rgba(0, 0, 0, 0.4);
    color: rgba(0, 0, 0, 0.9);
  }

  .audio-player-play .icon-pause { display: none; }
  .audio-player.playing .audio-player-play .icon-play { display: none; }
  .audio-player.playing .audio-player-play .icon-pause { display: block; }

  .audio-player-track {
    position: relative;
    flex: 1;
    min-width: 0;
    min-height: 44px;
    cursor: pointer;
    padding: 8px 0;
  }

  .audio-player-seek {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
    z-index: 1;
  }
  .audio-player-track:has(.audio-player-seek:focus-visible) {
    outline: 2px solid var(--color-title);
    outline-offset: 3px;
  }

  .audio-player-progress {
    width: 100%;
    height: 1px;
    background: rgba(0, 0, 0, 0.1);
    position: relative;
  }

  .audio-player-filled {
    height: 100%;
    background: rgba(0, 0, 0, 0.55);
    width: 0%;
    transition: width 0.1s linear;
  }

  .audio-player-track:hover .audio-player-progress {
    height: 2px;
  }

  /* Waveform seekbar — tight vertical lines around a black hairline axis, always
     visible. The bars rest gray and fill to black as the piece plays (the progress
     clip reveals the black copy left-to-right). Bar stroke-width is in viewBox
     units so the bar:gap ratio holds at any rendered size. */
  .ap-wave {
    display: block;
    width: 100%;
    height: 30px;
  }
  .ap-wave-axis {
    stroke: var(--color-rule);
    stroke-width: 1;
    vector-effect: non-scaling-stroke;
  }
  .ap-wave-bars {
    fill: none;
    stroke: rgba(0, 0, 0, 0.28);
    stroke-width: 1;
    vector-effect: non-scaling-stroke; /* 1px on screen — the axis line's exact weight */
  }
  .ap-wave-fill {
    fill: none;
    stroke: var(--color-rule);
    stroke-width: 1;
    vector-effect: non-scaling-stroke;
  }
  .ap-wave-clip { transition: clip-path 0.1s linear; }

  .audio-player-time {
    flex-shrink: 0;
    font-size: 11px;
    color: rgba(0, 0, 0, 0.45);
    letter-spacing: 0.03em;
    font-variant-numeric: tabular-nums;
  }

.side-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:0 0 12px}.side-head h2{margin:0}.downloads{display:flex;gap:16px;margin:0;font-size:12px}.downloads a{display:inline-flex;align-items:center;gap:5px;padding:12px 0;margin:-12px 0;color:#777;text-decoration:none}.downloads a:hover{color:#222}.downloads a:focus-visible{outline:1px solid #222;outline-offset:4px}

const API='https://alias-listening.vercel.app';

let expiresAt=0,linksUntil=0;
async function request(path,data={}){const r=await fetch(API+'/api/'+path,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(data)});const result=await r.json();if(!r.ok){if(r.status===401){token='';try{localStorage.removeItem('alias-listener-token');}catch{}players.forEach(p=>p.audio.pause());}throw new Error(result.error||'Please try again.');}return result;}
function links(tracks,until){linksUntil=until;for(const box of document.querySelectorAll('.downloads')){const track=tracks.find(t=>t.side===box.dataset.side);for(const a of box.querySelectorAll('a')){const url=track?.downloads?.[a.dataset.format];a.hidden=!url;if(url)a.href=url;}box.hidden=!box.querySelector('a:not([hidden])');}}

function duration(p){return Number.isFinite(p.audio.duration)&&p.audio.duration>0?p.audio.duration:Number(p.root.dataset.duration);}
function media(){if(!('mediaSession'in navigator))return;const a=active.audio;navigator.mediaSession.playbackState=a.paused?'paused':'playing';if('MediaMetadata'in window)navigator.mediaSession.metadata=new MediaMetadata({title:`ALIAS — Side ${active.side}`,album:'ALIAS'});if(Number.isFinite(a.duration)&&a.duration>0&&navigator.mediaSession.setPositionState){try{navigator.mediaSession.setPositionState({duration:a.duration,playbackRate:a.playbackRate,position:Math.min(a.currentTime,a.duration)});}catch{}}}
function paint(p){const a=p.audio,d=duration(p),t=a.currentTime,pct=p.pending??Math.min(100,t/d*100);p.root.classList.toggle('playing',!a.paused&&!a.ended);p.button.setAttribute('aria-label',`${a.paused?'Play':'Pause'} Side ${p.side}`);p.seek.value=pct;p.seek.setAttribute('aria-valuetext',`${fmt(t)} of ${fmt(d)}`);p.clip.style.clipPath=`inset(0 ${100-pct}% 0 0)`;p.time.textContent=`${fmt(t)} / ${fmt(d)}`;if(p===active)media();}
function applySeek(p){if(p.pending!==null&&Number.isFinite(p.audio.duration)&&p.audio.duration>0){p.audio.currentTime=p.pending/100*p.audio.duration;p.pending=null;}}
async function start(p){players.filter(other=>other!==p).forEach(other=>other.audio.pause());active=p;status.textContent='';try{if(!token)await initialize();else if(Date.now()+30*60000>=expiresAt)await authorize();await p.audio.play();}catch(e){if(e.name!=='AbortError')status.textContent='Press play to continue.';}paint(p);}
for(const p of players){p.button.addEventListener('click',()=>p.audio.paused?start(p):p.audio.pause());p.seek.addEventListener('input',()=>{p.pending=Number(p.seek.value);applySeek(p);paint(p);});for(const event of ['timeupdate','pause','durationchange','ended'])p.audio.addEventListener(event,()=>paint(p));p.audio.addEventListener('play',()=>{players.filter(other=>other!==p).forEach(other=>other.audio.pause());active=p;paint(p);});p.audio.addEventListener('loadedmetadata',()=>{applySeek(p);paint(p);});p.audio.addEventListener('playing',()=>{status.textContent='';if(!p.counted){p.counted=true;record(p);}paint(p);});p.audio.addEventListener('ended',()=>{p.counted=false;p.playId=crypto.randomUUID();});p.audio.addEventListener('waiting',()=>{if(p===active)status.textContent='Loading audio…';});p.audio.addEventListener('error',()=>{status.textContent=`Side ${p.side} could not load. Check your connection and try again.`;});paint(p);}
if('audioSession'in navigator){try{navigator.audioSession.type='playback';}catch{}}
function jump(s){const a=active.audio;if(Number.isFinite(a.duration))a.currentTime=Math.max(0,Math.min(a.duration,a.currentTime+s));paint(active);}
if('mediaSession'in navigator){for(const [name,handler] of Object.entries({play:()=>start(active),pause:()=>active.audio.pause(),seekbackward:e=>jump(-(e.seekOffset||15)),seekforward:e=>jump(e.seekOffset||15),seekto:e=>{if(Number.isFinite(e.seekTime)){active.pending=Math.max(0,Math.min(100,e.seekTime/duration(active)*100));applySeek(active);paint(active);}}})){try{navigator.mediaSession.setActionHandler(name,handler);}catch{}}}
for(const a of document.querySelectorAll('.downloads a[data-format="mp3"]'))a.addEventListener('click',async e=>{if(Date.now()+60000<linksUntil)return;e.preventDefault();try{if(!token)await initialize();else{const result=await request('session');links(result.tracks,result.expiresAt);}location.href=a.href;}catch{status.textContent='Download could not start. Refresh and try again.';}});
document.documentElement.classList.add('enhanced');
async function initialize(){try{if(!token){const result=await request('login');token=result.token;try{localStorage.setItem('alias-listener-token',token);}catch{}}await authorize();}catch(error){if(!token){const result=await request('login');token=result.token;try{localStorage.setItem('alias-listener-token',token);}catch{}await authorize();}else throw error;}}
initialize().catch(()=>{status.textContent='Audio could not load. Please refresh and try again.';});

</script></body></html>
