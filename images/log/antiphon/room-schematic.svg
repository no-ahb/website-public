<text x="560" y="736" text-anchor="middle" font-size="19">6 upper speakers</text>
<text x="560" y="762" text-anchor="middle" font-size="17" fill="#687067">Angled down toward the center</text>
<text x="322" y="831" text-anchor="middle" font-size="17" fill="#687067">Seated ear level</text>
