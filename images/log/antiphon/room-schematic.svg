<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1080" role="img" aria-labelledby="title desc">
<title id="title">ANTIPHON — two-layer loudspeaker arrangement</title>
<desc id="desc">Architectural schematic: a lower plan with eight Genelec speakers at seated ear height, an upper plan with six Genelec speakers near the ceiling, and a section showing the upper speakers angled down toward the room center. Positions and proportions are indicative, not measured.</desc>
<defs>
  <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V7" stroke="#b4b3ac" stroke-width="1"/></pattern>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m1 1 6 3-6 3" fill="none" stroke="#82867f" stroke-width="1.2"/></marker>
  <g id="monitor-plan"><path d="M-13-10 Q-15-8-15 0 Q-15 8-13 10 L10 13 Q14 13 14 9 V-9 Q14-13 10-13Z" fill="#414741" stroke="#414741" stroke-width="1.5"/><path d="M10-9V9" stroke="#f8f7f3" stroke-width="1.1"/></g>
  <g id="monitor-section"><path d="M-12-24 Q-17-21-17-13 V13 Q-17 21-12 24 H9 Q15 23 15 16 V-16 Q15-23 9-24Z" fill="#414741"/><path d="M11-18V18" stroke="#f8f7f3" stroke-width="1.2"/></g>
</defs>
<rect width="1120" height="1080" fill="#f8f7f3"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#353b36">
<text x="64" y="58" font-size="22" letter-spacing="2">ANTIPHON</text><text x="1056" y="58" font-size="17" text-anchor="end">HAUS FÜR MEDIENKUNST</text>
<path d="M64 80H1056" stroke="#777c74" stroke-width="1"/>
<text x="80" y="126" font-size="20">01   LOWER PLAN</text><text x="80" y="154" font-size="18" fill="#687067">8 Genelecs · seated ear height</text>
<text x="620" y="126" font-size="20">02   UPPER PLAN</text><text x="620" y="154" font-size="18" fill="#687067">6 Genelecs · near ceiling</text>

<path d="M70 190h440v330h-440Z M80 200v310h420v-310Z" fill="url(#hatch)" fill-rule="evenodd" stroke="#4c534b" stroke-width="1.4"/>
<path d="M610 190h440v330h-440Z M620 200v310h420v-310Z" fill="url(#hatch)" fill-rule="evenodd" stroke="#4c534b" stroke-width="1.4"/>
